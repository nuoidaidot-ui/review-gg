<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đánh giá dịch vụ</title>
    <style>
        body { font-family: 'Inter', sans-serif; text-align: center; background: #f0f2f5; padding: 40px 20px; }
        .card { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .logo { font-size: 50px; }
        h2 { margin: 10px 0; color: #1c1e21; }
        .stars { font-size: 40px; margin: 25px 0; cursor: pointer; }
        .star { color: #ddd; transition: 0.2s; }
        .star.active { color: #ffc107; }
        p { color: #606770; font-size: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">⭐</div>
        <h2 id="storeName">Cảm ơn bạn đã ghé thăm!</h2>
        <p>Bạn thấy dịch vụ của chúng tôi thế nào?</p>
        
        <!-- Khu vực 5 ngôi sao -->
        <div class="stars" id="starRating">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
        </div>
        
        <p id="statusText">Vui lòng chọn số sao để đánh giá</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const placeId = urlParams.get('id');
        const storeName = urlParams.get('name');
        const zaloPhone = urlParams.get('zalo') || '0900000000'; // SĐT Zalo mặc định

        if (storeName) document.getElementById('storeName').innerText = storeName.replace(/_/g, ' ');

        const stars = document.querySelectorAll('.star');
        stars.forEach(star => {
            star.addEventListener('click', () => {
                const rating = parseInt(star.getAttribute('data-value'));
                
                // Hiệu ứng sáng sao
                stars.forEach(s => s.classList.remove('active'));
                for(let i=0; i<rating; i++) stars[i].classList.add('active');

                // XỬ LÝ LOGIC LỌC
                setTimeout(() => {
                    if (rating >= 4) {
                        // NẾU HÀI LÒNG (4-5 SAO): Chuyển hướng Google Maps
                        window.location.href = `https://search.google.com/local/writereview?placeid=${placeId}`;
                    } else {
                        // NẾU KHÔNG HÀI LÒNG (1-3 SAO): Chuyển hướng về Zalo góp ý
                        alert("Chúng tôi rất tiếc vì trải nghiệm không tốt. Xin hãy góp ý để quán cải thiện ngay lập tức!");
                        window.location.href = `https://zalo.me/${zaloPhone}`;
                    }
                }, 800);
            });
        });
    </script>
</body>
</html>
